name: Publish Release

# Runs automatically any time obs_to_nvidia.lua changes on main -- no
# manual "create Release / upload asset" step needed on github.com
# ever again. Push (or merge a PR) to main and this takes care of the
# rest. "workflow_dispatch" is kept as a manual escape hatch (a "Run
# workflow" button in the Actions tab) in case you ever want to force
# a new Release without changing the file.
on:
  push:
    branches: [main]
    paths:
      - "obs_to_nvidia.lua"
  workflow_dispatch: {}

# Needed so the workflow's own token is allowed to create Releases in
# this repo -- no personal access token or secret to set up.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag is just a timestamp, since this project doesn't track a
      # version number anywhere -- every push gets its own unique tag,
      # so there's never a "tag already exists" clash to work around.
      - name: Generate a unique tag for this release
        id: tag
        run: echo "tag=auto-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      # make_latest: true is what makes /releases/latest/download/...
      # (the URL the script's own Update Checker hits) always resolve
      # to whatever this step just published.
      - name: Create Release and attach the script
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: obs_to_nvidia.lua
          make_latest: true
