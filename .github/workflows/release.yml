name: Stamp release script

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the attached script
        run: gh release download "$TAG" --pattern 'obs_to_nvidia.lua' --dir .

      - name: Stamp version from the tag
        run: |
          VERSION="${TAG#v}"
          grep -q '^local VERSION = "' obs_to_nvidia.lua || { echo "No 'local VERSION' line found"; exit 1; }
          sed -i "s/^local VERSION = \".*\"/local VERSION = \"$VERSION\"/" obs_to_nvidia.lua
          grep -n '^local VERSION' obs_to_nvidia.lua

      - name: Upload the stamped script back
        run: gh release upload "$TAG" obs_to_nvidia.lua --clobber
